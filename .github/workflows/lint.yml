name: Lint

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run markdownlint
        run: npm run lint:md

  tintin:
    name: Tintin headers lint
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Tintin headers linter (PowerShell)
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\scripts\check_tin_headers.ps1
        shell: powershell
