name: Lint

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and run markdownlint
        run: npm ci --ignore-scripts && npm run lint:md

  tintin:
    name: Tintin headers lint
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and run Tintin linter
        run: npm ci --ignore-scripts && npm run lint:tin
        shell: powershell
